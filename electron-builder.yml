appId: pro.getpeakflow.core
productName: PeakFlow
directories:
  buildResources: resources
  output: release
afterPack: scripts/after-pack.js
afterSign: scripts/notarize.js
files:
  - '!**/.vscode/*'
  - '!artifacts/**'
  - '!prototypes/**'
  - '!screenshots/**'
  - '!docs/**'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!sidecar/*'
  # developer-only files that must never ship inside the app
  - '!.claude/**'
  - '!.playwright-mcp/**'
  - '!scripts/**'
  - '!{CLAUDE.md,ROADMAP.md,eslint.config.js,.env.example}'
  - '!**/*.tsbuildinfo'
  - '!release/**'
  - '!**/*.log'
  - '!build/**'
mac:
  category: public.app-category.productivity
  # 512px source for the .icns (Windows keeps its own icon.png/icon.ico)
  icon: resources/icon-mac.png
  # Matches the Swift helper's deployment target (Package.swift: macOS 13)
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Custom sign hook: identical to the default signing, except the Swift
  # helper (peakflow-helper) is signed with sidecar/darwin/entitlements.helper.plist
  # (none) instead of the inherited JIT entitlements Electron's helpers need.
  sign: scripts/mac-sign.js
  # Signing: electron-builder uses a "Developer ID Application" identity from
  # the keychain (or CSC_LINK/CSC_KEY_PASSWORD). With none present it skips
  # signing and still produces an unsigned app.
  # Notarization runs in scripts/notarize.js (afterSign) from env vars, so the
  # built-in step stays off to avoid notarizing twice.
  notarize: false
  # Separate Apple-silicon and Intel downloads (each about half a universal build)
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: PeakFlow-${version}-${arch}.${ext}
  extendInfo:
    NSCameraUsageDescription: PeakFlow needs camera access for meeting prep and focus tools.
    NSMicrophoneUsageDescription: PeakFlow needs microphone access for meeting prep and mic mute controls.
    LSUIElement: true
  extraResources:
    - from: resources/darwin/peakflow-helper
      to: peakflow-helper
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  artifactName: PeakFlow-Setup-${version}.${ext}
  # Avoid winCodeSign cache extract (needs symlink privilege on Windows without Dev Mode)
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Silent install + restart when launched by an in-app updater (--updated),
  # including v1.6.5 apps that pass only --updated. See the file for details.
  include: build/installer.nsh
extraResources:
  - from: resources/soundsplit-bridge.ps1
    to: soundsplit-bridge.ps1
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png
asarUnpack:
  - "**/*.node"
  - "node_modules/koffi/**/*"
publish:
  provider: github
  owner: inchwormz
  repo: peakflow-releases
